<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicting Rating Using Random Forest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef1f8;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e2e6f0;--soft:#f3f5fb;--brand:#4f46e5;--brand2:#3b82f6;--good:#059669;--bad:#e11d48;--side:#12143a}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif;background:radial-gradient(900px 420px at 15% -10%,#c7cdfb88,transparent 60%),radial-gradient(700px 400px at 100% 0,#bfdbfe77,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#171a4d,var(--side));color:#e8eaff;padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:10px;box-shadow:0 8px 22px -6px #4f46e5aa}
.logo i{display:block;width:5px;border-radius:2px;background:#fff}
.logo i:nth-child(1){height:10px}.logo i:nth-child(2){height:18px}.logo i:nth-child(3){height:14px}
aside h3{font-size:19px;color:#fff}
aside p{color:#9ba2de;margin:0 0 28px;font-size:13px}
.fgroup{margin-bottom:30px}
.fgroup>label{display:block;font-weight:600;margin-bottom:12px;color:#fff}
.range-vals{display:flex;justify-content:space-between;margin-bottom:4px;font-weight:600;color:#a5b4fc}
.dual{position:relative;height:28px}
.track{position:absolute;top:12px;left:10px;right:10px;height:4px;background:#2d3170;border-radius:4px}
.fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--brand2),#a5b4fc);border-radius:4px}
.dual input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--brand2);box-shadow:0 4px 10px #0006;cursor:grab}
.dual input::-moz-range-thumb{pointer-events:all;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--brand2);cursor:grab}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--soft);border-radius:13px}
.seg button{flex:1 1 auto;border:0;background:none;color:var(--mute);padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink);background:#fff}
.seg button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 14px -6px #4f46e5aa}
aside .seg{background:#1f2360}
aside .seg button{color:#aab0e8}
aside .seg button:hover{background:#ffffff14;color:#fff}
:is(button,input,select,summary):focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
main{padding:30px 36px 70px;max-width:1280px;width:100%}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
header h1{font-size:34px;line-height:1.1}
header p{margin:6px 0 0;color:var(--mute)}
.status{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);padding:8px 15px;border-radius:999px;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.status.ok .dot{background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #10b981aa}70%{box-shadow:0 0 0 8px #10b98100}100%{box-shadow:0 0 0 0 #10b98100}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px -22px #1e2a6e66;transition:box-shadow .2s,border-color .2s}
.card:hover{border-color:#cdd3f0;box-shadow:0 16px 40px -22px #1e2a6e88}
.card h2{font-size:21px;margin-bottom:4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--accent,var(--brand))}
.kpi span{color:var(--mute);font-size:13px}
.kpi b{display:block;font:700 32px "Space Grotesk",sans-serif;margin-top:2px}
.grid{display:grid;gap:20px;margin-bottom:22px}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{margin-top:18px}
.field>label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.fields3 .field{margin-top:0}
.field input,.field select{width:100%;background:var(--soft);border:1.5px solid transparent;color:var(--ink);padding:11px 12px;border-radius:12px;font:inherit;transition:border-color .15s,background .15s}
.field input:hover,.field select:hover,.field input:focus,.field select:focus{border-color:var(--brand2);background:#fff;outline:0}
.hintline{color:var(--mute);font-size:12px;margin-top:4px}
button.primary{margin-top:24px;width:100%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:14px;padding:15px;font:600 16px Manrope;cursor:pointer;transition:transform .15s,box-shadow .15s}
button.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -10px #4f46e5cc}
button.primary:disabled{opacity:.6;cursor:wait;transform:none}
.err{color:var(--bad);font-size:14px;margin-top:12px}
.result{position:sticky;top:20px;align-self:start;text-align:center;padding:30px 24px;background:linear-gradient(180deg,#f7f8ff,#fff)}
.gauge{position:relative;width:260px;max-width:100%;margin:6px auto 0}
.gauge svg{width:100%;display:block}
.gauge .bg{fill:none;stroke:var(--line);stroke-width:16;stroke-linecap:round}
.gauge .fg{fill:none;stroke-width:16;stroke-linecap:round;stroke-dasharray:251.33;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.gauge .num{position:absolute;left:0;right:0;bottom:2px;font:700 44px/1 "Space Grotesk",sans-serif}
.plabel{color:var(--mute);font-size:13px;margin:6px 0 14px}
.verdict{display:inline-block;padding:8px 20px;border-radius:999px;font:700 17px "Space Grotesk",sans-serif;background:var(--soft);color:var(--mute)}
.verdict.good{background:#05966918;color:var(--good)}.verdict.bad{background:#e11d4814;color:var(--bad)}
.note{color:var(--mute);font-size:13px;margin:16px auto 0;max-width:250px}
.sechead{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
.sechead h2{font-size:24px}.sechead span{color:var(--mute);font-size:14px}
.cwrap{position:relative;height:340px}
.notice{display:flex;align-items:center;gap:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:16px 18px;margin-bottom:22px}
details.card summary{cursor:pointer;font:700 20px "Space Grotesk",sans-serif}
.tbl{overflow:auto;max-height:380px;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
tbody tr:hover{background:var(--soft)}
.pill{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.g{background:#05966918;color:var(--good)}.pill.b{background:#e11d4814;color:var(--bad)}
@media(max-width:1000px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr!important}.result{position:static}main{padding:22px 16px 60px}}
@media(max-width:560px){.fields3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;
const API = 'http://127.0.0.1:8000';
const PALETTE = ['#2563eb', '#f97316', '#16a34a', '#dc2626', '#9333ea', '#eab308', '#0891b2', '#db2777'];
Chart.defaults.color = '#6b7280';
Chart.defaults.font.family = 'Manrope, system-ui, sans-serif';

/* ---- same options and column names as the Streamlit app ---- */
const JOBS = [['Data Analyst', 'job_title_data_analyst'], ['Data Scientist', 'job_title_data_scientist'],
              ['Data Engineer', 'job_title_data_engineer'], ['Machine Learning Engineer', 'job_title_machine_learning_engineer']];
const SENIORITY = [['Lead', 'seniority_level_lead'], ['Senior', 'seniority_level_senior'],
                   ['Junior', 'seniority_level_junior'], ['Mid Level', 'seniority_level_midlevel']];
const STATUS = [['Hybrid', 'status_hybrid'], ['Remote', 'status_remote'], ['On Site', 'status_on_site'], ['Unknown', 'status_unknown']];
const INDUSTRIES = ['Education', 'Energy', 'Finance', 'Healthcare', 'Logistics', 'Manufacturing', 'Retail', 'Technology']
  .map(n => [n, 'industry_' + n.toLowerCase()]);
const OWNERSHIP = [['Public', 'ownership_public'], ['Private', 'ownership_private']];

const on = v => v === 1 || v === true || v === '1' || v === 'True';
const labelOf = (r, list) => { const m = list.find(([, k]) => on(r[k])); return m ? m[0] : '–'; };
const isGood = r => r.salary_category == 1;
const compact = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 });

/* ---------- Components ---------- */
function Seg({ options, value, onChange, label }) {
  return (
    <div className="seg" role="radiogroup" aria-label={label}>
      {options.map(([v, text]) => (
        <button key={v} role="radio" aria-checked={v === value} className={v === value ? 'on' : ''} onClick={() => onChange(v)}>{text}</button>
      ))}
    </div>
  );
}

function DualSlider({ lo, hi, value: [a, b], onChange }) {
  const pct = v => hi === lo ? 0 : (v - lo) / (hi - lo) * 100;
  return (
    <div className="dual">
      <div className="track"><div className="fill" style={{ left: pct(a) + '%', width: (pct(b) - pct(a)) + '%' }} /></div>
      <input type="range" min={lo} max={hi} value={a} aria-label="Minimum company size"
        style={{ zIndex: a > hi - (hi - lo) * 0.1 ? 3 : 1 }} onChange={e => onChange([Math.min(+e.target.value, b), b])} />
      <input type="range" min={lo} max={hi} value={b} aria-label="Maximum company size"
        style={{ zIndex: 2 }} onChange={e => onChange([a, Math.max(+e.target.value, a)])} />
    </div>
  );
}

const clampNum = (v, lo, hi) => Math.min(hi, Math.max(lo, v === '' || isNaN(+v) ? lo : Math.round(+v)));

function NumField({ label, min, max, step, value, onChange }) {
  return (
    <div className="field">
      <label>{label}</label>
      <input type="number" min={min} max={max} step={step} value={value}
        onChange={e => onChange(e.target.value)}
        onBlur={() => onChange(String(clampNum(value, min, max)))} />
      <div className="hintline">From {min.toLocaleString()} to {max.toLocaleString()}</div>
    </div>
  );
}

function useCountUp(target) {
  const [v, setV] = useState(0);
  const prev = useRef(0);
  useEffect(() => {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setV(target); return; }
    const from = prev.current, t0 = performance.now(), dur = 650;
    let id;
    const tick = now => {
      const p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      setV(from + (target - from) * e);
      if (p < 1) id = requestAnimationFrame(tick); else prev.current = target;
    };
    id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [target]);
  return v;
}

function Kpi({ label, value, format, accent, empty }) {
  const shown = useCountUp(value);
  return (
    <div className="card kpi" style={{ '--accent': accent }}>
      <span>{label}</span>
      <b>{empty ? '–' : format(shown)}</b>
    </div>
  );
}

function ChartBox({ type, data, options }) {
  const ref = useRef(), chart = useRef();
  useEffect(() => {
    chart.current = new Chart(ref.current, { type, data, options });
    return () => chart.current.destroy();
  }, []);
  useEffect(() => {
    if (!chart.current) return;
    chart.current.data = data;
    chart.current.update();
  }, [data]);
  return <div className="cwrap"><canvas ref={ref} /></div>;
}

/* ---------- Prediction ---------- */
function Predictor({ onOffline }) {
  const [f, setF] = useState({ company: 100, days: 30, size: 1000, job: 'Data Scientist', level: 'Senior',
                               status: 'Hybrid', industry: 'Technology', own: 'Public' });
  const [res, setRes] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const set = k => v => setF(s => ({ ...s, [k]: v }));
  const sel = k => e => set(k)(e.target.value);

  async function predict() {
    const company = clampNum(f.company, 1, 1000), days = clampNum(f.days, 0, 1095), size = clampNum(f.size, 5, 865476);
    setF(s => ({ ...s, company, days, size }));
    const payload = { company, post_date_days: days, company_size: size };
    [[JOBS, f.job], [SENIORITY, f.level], [STATUS, f.status], [INDUSTRIES, f.industry], [OWNERSHIP, f.own]]
      .forEach(([list, chosen]) => list.forEach(([label, key]) => payload[key] = label === chosen ? 1 : 0));

    setLoading(true); setErr('');
    try {
      const r = await fetch(API + '/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      setRes({ good: j.Prediction === 1, p: j.Probability });
    } catch (e) {
      setErr('Could not connect to API server!');
      onOffline();
    }
    setLoading(false);
  }

  const pct = res ? Math.round(res.p * 1000) / 10 : null;
  const color = res ? (res.good ? '#059669' : '#e11d48') : '#e2e6f0';
  return (
    <div className="grid" style={{ gridTemplateColumns: '1.4fr .8fr' }}>
      <div className="card">
        <h2>Company Features</h2>
        <p className="sub">Fill the user features below.</p>
        <div className="fields3">
          <NumField label="Company Number" min={1} max={1000} step={10} value={f.company} onChange={set('company')} />
          <NumField label="Post Date Days" min={0} max={1095} step={10} value={f.days} onChange={set('days')} />
          <NumField label="Company Size" min={5} max={865476} step={100} value={f.size} onChange={set('size')} />
        </div>
        <div className="field"><label>Job Title</label>
          <select value={f.job} onChange={sel('job')}>{['Data Analyst', 'Data Scientist', 'Data Engineer', 'Machine Learning Engineer'].map(o => <option key={o}>{o}</option>)}</select></div>
        <div className="field"><label>Seniority Level</label>
          <Seg label="Seniority Level" value={f.level} onChange={set('level')} options={['Lead', 'Senior', 'Junior', 'Mid Level'].map(o => [o, o])} /></div>
        <div className="field"><label>Status</label>
          <Seg label="Status" value={f.status} onChange={set('status')} options={['Hybrid', 'Remote', 'On Site', 'Unknown'].map(o => [o, o])} /></div>
        <div className="field"><label>Industry</label>
          <select value={f.industry} onChange={sel('industry')}>{INDUSTRIES.map(([o]) => <option key={o}>{o}</option>)}</select></div>
        <div className="field"><label>Ownership</label>
          <Seg label="Ownership" value={f.own} onChange={set('own')} options={['Public', 'Private'].map(o => [o, o])} /></div>
        <button className="primary" onClick={predict} disabled={loading}>{loading ? 'Predicting…' : 'Predict'}</button>
        {err && <div className="err" role="alert">{err}</div>}
      </div>

      <div className="card result">
        <h2 style={{ fontSize: 20, marginBottom: 14 }}>Prediction</h2>
        <div className="gauge">
          <svg viewBox="0 0 180 100">
            <path className="bg" d="M 10 90 A 80 80 0 0 1 170 90" />
            <path className="fg" d="M 10 90 A 80 80 0 0 1 170 90" style={{ stroke: color, strokeDashoffset: 251.33 * (1 - (res ? res.p : 0)) }} />
          </svg>
          <div className="num">{res ? pct + '%' : '–'}</div>
        </div>
        <div className="plabel">Probability</div>
        <span className={'verdict ' + (res ? (res.good ? 'good' : 'bad') : '')}>{res ? (res.good ? 'Good Rate' : 'Mid to Bad Rate') : 'No result yet'}</span>
        <p className="note">{res ? 'This is the model\'s probability for the prediction above.' : 'Fill the features before clicking Predict.'}</p>
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [rows, setRows] = useState([]);
  const [online, setOnline] = useState(null);
  const [size, setSize] = useState([0, 300000]);
  const [level, setLevel] = useState('Lead');
  const loaded = useRef(false);

  function loadData() {
    fetch(API + '/data').then(r => r.json()).then(list => {
      const data = list.map(r => ({
        ...r, Job: labelOf(r, JOBS), Level: labelOf(r, SENIORITY), Status: labelOf(r, STATUS),
        Industry: labelOf(r, INDUSTRIES), Owner: labelOf(r, OWNERSHIP)
      }));
      let lo = Infinity;
      for (const r of data) if (r.company_size < lo) lo = r.company_size;
      loaded.current = true;
      setRows(data); setOnline(true);
      setSize([Math.floor(lo), 300000]);
    }).catch(() => setOnline(false));
  }

  useEffect(() => {
    loadData();
    const id = setInterval(() => { if (!loaded.current) loadData(); }, 5000);
    return () => clearInterval(id);
  }, []);

  const minSize = useMemo(() => {
    let lo = Infinity;
    for (const r of rows) if (r.company_size < lo) lo = r.company_size;
    return rows.length ? Math.floor(lo) : 0;
  }, [rows]);

  const d = useMemo(() => rows.filter(r => r.company_size >= size[0] && r.company_size <= size[1] && r.Level === level), [rows, size, level]);
  const good = useMemo(() => d.filter(isGood), [d]);
  const n = d.length;
  const mean = k => n ? d.reduce((s, r) => s + (+r[k] || 0), 0) / n : 0;

  const pieData = useMemo(() => {
    const counts = INDUSTRIES.map(([name]) => [name, good.filter(r => r.Industry === name).length]).filter(([, c]) => c > 0);
    return { labels: counts.map(c => c[0]), datasets: [{ data: counts.map(c => c[1]), backgroundColor: counts.map(c => PALETTE[INDUSTRIES.findIndex(i => i[0] === c[0])]), borderColor: '#fff', borderWidth: 3 }] };
  }, [good]);

  const pieOpts = { maintainAspectRatio: false, cutout: '58%',
    plugins: { legend: { position: 'right', labels: { usePointStyle: true, padding: 16 } },
      tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw} companies` } } } };

  return (
    <div className="app">
      <aside>
        <div className="brand"><div className="logo"><i /><i /><i /></div><h3>Features Filter</h3></div>
        <p>Choose which companies appear in the dashboard.</p>
        <div className="fgroup">
          <label>Company Size</label>
          <div className="range-vals"><span>{size[0].toLocaleString()}</span><span>{size[1].toLocaleString()}</span></div>
          <DualSlider lo={minSize} hi={300000} value={size} onChange={setSize} />
        </div>
        <div className="fgroup"><label>Seniority Level</label>
          <Seg label="Seniority filter" value={level} onChange={setLevel} options={['Lead', 'Senior', 'Junior', 'Mid Level'].map(o => [o, o])} /></div>
      </aside>

      <main>
        <header>
          <div>
            <h1>Predicting Rating Using Random Forest</h1>
            <p>Powered by Random Forest Classifier Model</p>
          </div>
          <div className={'status' + (online ? ' ok' : '')}>
            <span className="dot" />
            {online === null ? 'Connecting to API…' : online ? 'API connected' : 'API offline. Start FastAPI on port 8000'}
          </div>
        </header>

        <section className="kpis">
          <Kpi label="Companies in selection" value={n} format={v => Math.round(v).toLocaleString()} accent="#4f46e5" empty={!rows.length} />
          <Kpi label="Good rate (salary category 1)" value={n ? good.length / n * 100 : 0} format={v => v.toFixed(1) + '%'} accent="#059669" empty={!n} />
          <Kpi label="Average company size" value={mean('company_size')} format={v => compact.format(v)} accent="#3b82f6" empty={!n} />
          <Kpi label="Average post age (days)" value={mean('post_date_days')} format={v => v.toFixed(0)} accent="#f59e0b" empty={!n} />
        </section>

        <Predictor onOffline={() => { loaded.current = false; setOnline(false); }} />

        <div className="sechead"><h2>Visualization Dashboard</h2><span>{rows.length > 0 && `${rows.length.toLocaleString()} companies loaded`}</span></div>

        {rows.length > 0 && n === 0 && <div className="notice" role="status">No company matched the filtered data, try again!</div>}
        {rows.length > 0 && n > 0 && good.length === 0 && <div className="notice" role="status">No companies with salary_category = 1 were found.</div>}

        {good.length > 0 && (
          <div className="card" style={{ marginBottom: 22 }}>
            <h2>Salary Category Proportion Over Industry</h2>
            <p className="sub">Industries of the companies with salary category 1 in the current selection.</p>
            <ChartBox type="doughnut" data={pieData} options={pieOpts} />
          </div>
        )}

        {rows.length > 0 && (
          <details className="card">
            <summary>First 100 Rows</summary>
            <div className="tbl"><table>
              <thead><tr>{['Salary cat.', 'Job title', 'Seniority', 'Status', 'Industry', 'Ownership', 'Company', 'Post days', 'Size'].map(c => <th key={c}>{c}</th>)}</tr></thead>
              <tbody>{rows.slice(0, 100).map((r, i) => (
                <tr key={i}>
                  <td><span className={'pill ' + (isGood(r) ? 'g' : 'b')}>{isGood(r) ? 'Good' : 'Mid to bad'}</span></td>
                  <td>{r.Job}</td><td>{r.Level}</td><td>{r.Status}</td><td>{r.Industry}</td><td>{r.Owner}</td>
                  <td>{r.company}</td><td>{r.post_date_days}</td><td>{r.company_size}</td>
                </tr>))}
              </tbody>
            </table></div>
          </details>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
